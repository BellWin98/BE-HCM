name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_REPO }}/hcm

    # 테스트(@SpringBootTest)가 실제 로컬 인프라와 동일한 구성(src/test/resources/application-local.yml:
    # localhost:3306 root/1234, localhost:6379)을 기대하므로, CI에서도 동일하게 서비스 컨테이너로 띄운다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: hcm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
          --health-start-period=20s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 액션 버전은 Node 24 런타임 기준으로 맞춘다. Node 20 기반(v4 이하)은 러너에서 deprecated 경고가 뜨고
      # 향후 실행이 거부될 수 있다. gradle/actions 는 v6 부터 캐시 컴포넌트가 비공개 라이선스로 바뀌어
      # (Terms of Use 동의 필요) MIT 로 남아 있는 v5 에 고정한다.
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Gradle 캐싱. actions/cache 는 build.gradle 해시가 같으면 캐시를 새로 저장하지 않아
      # 빌드 캐시(build-cache-1)·구성 캐시가 매번 비어 있었다. setup-gradle 은 의존성·wrapper·
      # 빌드 캐시·구성 캐시를 모두 다루고, 내용이 바뀌면 매 실행마다 저장한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # PR 에서는 캐시를 읽기만 한다(main/dev 가 쓴 캐시를 base 브랜치로 공유받는다).
          # 브랜치마다 캐시를 쓰면 저장소 캐시 한도(10GB)를 금방 채워 main 캐시가 밀려난다.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # 구성 캐시(.gradle/configuration-cache)는 비밀값을 담을 수 있어 암호화 키가 있을 때만 저장/복원된다.
          # 비어 있으면 무시되므로 선택 사항이다. 켜려면 `openssl rand -base64 16` 결과를
          # 저장소 시크릿 GRADLE_ENCRYPTION_KEY 로 등록한다 (구성 단계 약 15초 절감).
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 새 러너에는 build/ 가 없으므로 clean 은 불필요하다.
      - name: Build with Gradle (테스트 포함)
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      # 아래 Docker 단계는 push 이벤트에서만 실행한다. PR 에서는 이미지를 푸시하지 않고,
      # Dockerfile 이 jar 복사뿐이라 빌드해 봐야 검증되는 것이 없는데 30 초 가까이 걸렸다.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Calculate Docker Tags
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi
          echo "SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      # 도커 빌드 및 푸시
      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci # CI Job이 성공해야만 실행됨
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }} # PR이벤트 아닐때만 실행

    # 동적으로 환경(Environment) 선택
    # main 브랜치면 production 환경, 아니면 development 환경의 변수(Secrets)를 가져옴
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          # 환경별로 Secret 이름은 같지만(EC2_HOST) 값은 다름 (GitHub Settings에서 설정 필요)
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          # main이면 latest, 아니면 dev 태그 사용
          IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
          DOCKER_COMPOSE_PATH: ${{ secrets.DOCKER_COMPOSE_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_REPO, IMAGE_TAG, DOCKER_COMPOSE_PATH
          script: |
            sudo docker stop hcm || true
            sudo docker rm -f $(sudo docker ps --filter 'status=exited' -a -q) || true
            sudo docker pull $DOCKER_REPO/hcm:$IMAGE_TAG
            sudo docker image prune -f
            sudo docker-compose -f $DOCKER_COMPOSE_PATH up -d
# 앱(logback LogstashTcpSocketAppender) → tcp/json_lines → Elasticsearch data stream.
#
# 앱이 이미 JSON(@timestamp, level, logger_name, thread_name, message, stack_trace, requestId, memberId,
# app, env)으로 보내므로 파싱(grok)이나 filter 는 없다. 필드를 바꾸고 싶으면 logback-spring.xml 의
# LogstashEncoder 쪽을 고치는 편이 한 곳에서 끝난다.

input {
  tcp {
    port  => 5044
    # 한 줄 상한 1MB. 스택트레이스를 실어도 수십 KB 라 충분하고, 기본값(512MB)은 구분자 누락 시 OOM 위험이 있어
    # Logstash 가 기동 시 명시하라고 경고한다.
    codec => json_lines { decode_size_limit_bytes => 1048576 }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 인덱스명 직접 지정 대신 data stream(logs-hcm-<env>)을 쓴다. ES 내장 logs 템플릿·ILM 이 자동으로
    # 붙어 운영에서 보관 기간(예: 30일 삭제)을 ILM 정책 하나로 다룰 수 있다.
    data_stream           => true
    data_stream_type      => "logs"
    data_stream_dataset   => "hcm"
    data_stream_namespace => "${LOG_ENV:local}"
  }
}

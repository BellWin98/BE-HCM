# 빌드 JVM 힙. 기본값(512m)으로는 Spring Boot 4 의존성 해석·컴파일 중 GC 가 잦아 CI 에서 수 초를 잃는다.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 빌드 캐시. 입력(소스·클래스패스)이 같은 태스크(compileJava, test 등)의 결과를 재사용한다.
# CI 에서는 gradle/actions/setup-gradle 이 ~/.gradle/caches/build-cache-1 을 함께 저장/복원한다.
org.gradle.caching=true

# 구성 캐시. 플러그인 적용·태스크 그래프 구성 결과를 저장해 두 번째 빌드부터 구성 단계를 건너뛴다.
# CI 로그 기준 구성 단계가 약 17 초로, 컴파일보다 오래 걸렸다. 단, CI 러너는 매번 새로 뜨므로
# setup-gradle 에 cache-encryption-key 가 설정되어 있을 때만 실행 간에 재사용된다(deploy.yml 참고).
org.gradle.configuration-cache=true

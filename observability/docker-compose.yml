services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: hcm-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # 로컬에서 실행 중인 스프링부트 앱(host)의 8080 포트를 스크레이핑해야 하므로,
    # 컨테이너에서 host.docker.internal 로 접근할 수 있게 해 준다(Linux 에서도 동작하도록 명시).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: hcm-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/hcm?useSSL=false&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true # 콘솔창에 출력되는 SQL문을 사람이 보기 편한 형태로 출력
        highlight_sql: true
    hibernate:
      # 스키마 변경은 Flyway(db/migration)가 담당한다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

cloud:
  aws:
    credentials:
      access-key: ENC(SPPzrqWgyXUXVTcgjkyUpRu3M1WMigX4naC5pEWqHt0=)
      secret-key: ENC(cB07qYeqVSis0WKZqqoOsLhNc+Hes1hJnhHbBIflyGMLQRmVDLno7Ne9poRh3DGT7D1vwwKHo5Q=)
    s3:
      bucket: ENC(6V5nfAzhQgBTFIntlqAi03ssLAzppMvX)
    region:
      static: ap-northeast-2

# 프론트엔드 URL (OAuth 콜백 리다이렉트용)
app:
  frontend-url: http://localhost:3000

# 로깅 설정. 출력 방식(콘솔/롤링 파일/gz)은 logback-spring.xml 이, 레벨은 여기가 정한다.
logging:
  # logback-spring.xml 의 LOG_PATH. 프로젝트 루트 기준 상대 경로라 bootRun/테스트 모두 BE-HCM/logs/ 에 남는다.
  # (.gitignore 에 logs/ 등록). 운영과 같은 파일 구성(app.log, error.log, archive/*.gz)을 로컬에서 그대로 확인한다.
  file:
    path: ./logs
  level:
    root: INFO
    com.behcm: DEBUG